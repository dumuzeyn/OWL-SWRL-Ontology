<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Онтология учебной группы</title>
  <desc id="desc">Преподаватель хорошо относится к сдавшим студентам и плохо относится к должнику.</desc>
  <defs>
    <style>
      .bg { fill: #fbfcfe; }
      .h { fill: #182235; font: 700 30px Arial, sans-serif; }
      .node { fill: #fff; stroke: #c8d3df; stroke-width: 2; rx: 8; }
      .teacher { fill: #e8f2ff; stroke: #7db0dd; }
      .passed { fill: #e7f8e2; stroke: #82bd72; }
      .debt { fill: #ffe7ea; stroke: #df7e88; }
      .label { fill: #172033; font: 700 17px Arial, sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .small { fill: #526070; font: 15px Arial, sans-serif; text-anchor: middle; }
      .good { stroke: #2f8f46; stroke-width: 3; fill: none; marker-end: url(#goodArrow); }
      .bad { stroke: #c8424d; stroke-width: 3; fill: none; marker-end: url(#badArrow); }
    </style>
    <marker id="goodArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2f8f46"/>
    </marker>
    <marker id="badArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#c8424d"/>
    </marker>
  </defs>
  <rect class="bg" width="1000" height="560"/>
  <text class="h" x="60" y="70">task1.ttl: преподаватель и студенты</text>

  <rect class="node teacher" x="385" y="120" width="230" height="70"/>
  <text class="label" x="500" y="150">Павел Аркадович</text>
  <text class="small" x="500" y="174">Преподаватель</text>

  <rect class="node passed" x="90" y="330" width="160" height="68"/>
  <text class="label" x="170" y="357">Андрей</text>
  <text class="small" x="170" y="381">Сдавший</text>

  <rect class="node passed" x="310" y="330" width="160" height="68"/>
  <text class="label" x="390" y="357">Антон</text>
  <text class="small" x="390" y="381">Сдавший</text>

  <rect class="node passed" x="530" y="330" width="160" height="68"/>
  <text class="label" x="610" y="357">Максим</text>
  <text class="small" x="610" y="381">Сдавший</text>

  <rect class="node debt" x="750" y="330" width="160" height="68"/>
  <text class="label" x="830" y="357">Гриша</text>
  <text class="small" x="830" y="381">Должник</text>

  <path class="good" d="M450 190 C340 230 235 260 175 330"/>
  <path class="good" d="M480 190 C435 238 405 278 392 330"/>
  <path class="good" d="M520 190 C555 238 590 278 608 330"/>
  <path class="bad" d="M580 190 C700 230 790 265 826 330"/>

  <text class="small" x="250" y="246">Относиться хорошо</text>
  <text class="small" x="760" y="246">Относиться плохо</text>
</svg>
