<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">Обзор онтологий MMSEP_Zeynalov</title>
  <desc id="desc">Три блока показывают учебную группу, семейные связи и медицинское SWRL-правило.</desc>
  <defs>
    <style>
      .bg { fill: #f7f9fc; }
      .title { fill: #172033; font: 700 34px Arial, sans-serif; }
      .subtitle { fill: #526070; font: 18px Arial, sans-serif; }
      .card { fill: #ffffff; stroke: #d8e0ea; stroke-width: 2; rx: 8; }
      .cardTitle { fill: #172033; font: 700 24px Arial, sans-serif; }
      .text { fill: #465466; font: 17px Arial, sans-serif; }
      .pillBlue { fill: #dff0ff; stroke: #7eb6df; }
      .pillGreen { fill: #e3f7df; stroke: #8cc57c; }
      .pillRose { fill: #ffe5e6; stroke: #e28a91; }
      .pillYellow { fill: #fff1c9; stroke: #d9b75f; }
      .line { stroke: #6b7788; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .nodeText { fill: #172033; font: 700 16px Arial, sans-serif; text-anchor: middle; dominant-baseline: middle; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#6b7788"/>
    </marker>
  </defs>
  <rect class="bg" width="1100" height="520"/>
  <text class="title" x="60" y="70">MMSEP_Zeynalov: OWL и SWRL онтологии</text>
  <text class="subtitle" x="60" y="105">Учебные модели для классов, свойств, индивидов и правил логического вывода</text>

  <rect class="card" x="60" y="155" width="300" height="275"/>
  <text class="cardTitle" x="90" y="205">task1.ttl</text>
  <text class="text" x="90" y="238">Учебная группа</text>
  <rect class="pillBlue" x="95" y="275" width="120" height="46" rx="23"/>
  <text class="nodeText" x="155" y="298">Студент</text>
  <rect class="pillGreen" x="205" y="350" width="130" height="46" rx="23"/>
  <text class="nodeText" x="270" y="373">Сдавший</text>
  <rect class="pillRose" x="80" y="350" width="110" height="46" rx="23"/>
  <text class="nodeText" x="135" y="373">Должник</text>
  <path class="line" d="M155 322 C150 338 142 340 137 350"/>
  <path class="line" d="M170 322 C195 342 220 342 245 350"/>

  <rect class="card" x="400" y="155" width="300" height="275"/>
  <text class="cardTitle" x="430" y="205">task2.ttl</text>
  <text class="text" x="430" y="238">Семейные связи</text>
  <rect class="pillYellow" x="445" y="285" width="100" height="44" rx="22"/>
  <text class="nodeText" x="495" y="307">Андрей</text>
  <rect class="pillBlue" x="560" y="285" width="95" height="44" rx="22"/>
  <text class="nodeText" x="607" y="307">Борис</text>
  <rect class="pillGreen" x="505" y="365" width="110" height="44" rx="22"/>
  <text class="nodeText" x="560" y="387">Володя</text>
  <path class="line" d="M545 307 L560 307"/>
  <path class="line" d="M607 329 L568 365"/>
  <text class="text" x="443" y="352">имеет ребенка / родителя</text>

  <rect class="card" x="740" y="155" width="300" height="275"/>
  <text class="cardTitle" x="770" y="205">task3</text>
  <text class="text" x="770" y="238">Медицинское правило</text>
  <rect class="pillBlue" x="780" y="282" width="105" height="44" rx="22"/>
  <text class="nodeText" x="832" y="304">Пациент</text>
  <rect class="pillRose" x="910" y="282" width="95" height="44" rx="22"/>
  <text class="nodeText" x="957" y="304">Диагноз</text>
  <rect class="pillGreen" x="835" y="365" width="110" height="44" rx="22"/>
  <text class="nodeText" x="890" y="387">Инсулин</text>
  <path class="line" d="M885 304 L910 304"/>
  <path class="line" d="M838 326 C850 350 865 360 882 365"/>
  <text class="text" x="780" y="352">SWRL: масса / 100 * 15</text>
</svg>
